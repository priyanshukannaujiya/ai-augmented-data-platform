name: DataOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Code and Structure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Python Syntax Validation
        run: python -m compileall . -q

      - name: Project Structure Validation
        run: |
          echo "Checking for critical pipeline files..."
          test -f generator/producer.py || { echo "Missing generator/producer.py"; exit 1; }
          test -f generator/consumer.py || { echo "Missing generator/consumer.py"; exit 1; }
          test -f airflow/dags/ecommerce_pipeline.py || { echo "Missing airflow/dags/ecommerce_pipeline.py"; exit 1; }
          echo "All critical files present."

      - name: Linting (Critical Errors Only)
        run: |
          pip install flake8
          # Check for serious errors: E9 (syntax/indentation), F63 (invalid operators/tests), F7 (type hints/format), F82 (undefined names)
          flake8 generator/producer.py generator/consumer.py airflow/dags/ecommerce_pipeline.py --select=E9,F63,F7,F82 --show-source

      - name: Security / Secret Detection
        run: |
          echo "Scanning for hardcoded AWS credentials..."
          # grep -q exits 0 if a match is found. We use it to avoid printing the matching line.
          if grep -r -q -E --exclude-dir=.git "AKIA[0-9A-Z]{16}|aws_access_key_id\s*=\s*['\"][A-Za-z0-9]+['\"]|aws_secret_access_key\s*=\s*['\"][A-Za-z0-9/+=]+['\"]" .; then
            echo "::error::Security Alert: Potential AWS credentials detected in source code."
            exit 1
          else
            echo "No obvious AWS credentials found."
          fi
